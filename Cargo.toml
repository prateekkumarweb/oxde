[workspace]
members = ["oxde-db", "xtask"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
axum = "0.8.9"
base64 = "0.23.0"
bollard = "0.21.0"
bytes = "1.12.1"
futures-util = "0.3.33"
gix = "0.86.0"
hyper-util = "0.1.20"
jiff = "0.2.34"
oxde-db = { path = "oxde-db" }
papaya = "0.2.4"
rand = "0.10.2"
rmcp = "2.2.0"
rust-embed = "8.12.0"
schemars = "1.2.1"
serde = "1.0.229"
serde_json = "1.0.151"
sysinfo = "0.39.6"
thiserror = "2.0.19"
toasty = "0.9.0"
toasty-cli = "0.9.0"
toasty-core = "0.9.0"
tokio = "1.53.1"
toml = "1.1.3"
tower = "0.5.3"
tower-http = "0.7.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ts-rs = "12.0.1"
uuid = "1.24.0"
zip = "8.6.0"

[package]
name = "oxde"
edition = "2024"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
argon2.workspace = true
axum = { workspace = true, features = ["multipart"] }
base64.workspace = true
bollard.workspace = true
bytes.workspace = true
futures-util.workspace = true
gix = { workspace = true, features = ["blocking-network-client", "blocking-http-transport-reqwest-rust-tls"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
jiff = { workspace = true, features = ["serde"] }
oxde-db.workspace = true
papaya.workspace = true
rand.workspace = true
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
rust-embed = { workspace = true, features = ["mime-guess"] }
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
toasty.workspace = true
tokio = { workspace = true, features = ["full"] }
toml.workspace = true
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["fs", "trace", "validate-request"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
ts-rs = { workspace = true, features = ["jiff-impl"] }
uuid = { workspace = true, features = ["v7"] }
zip.workspace = true
