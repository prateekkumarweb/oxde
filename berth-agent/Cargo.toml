[package]
name = "berth-agent"
edition = "2024"

[dependencies]
anyhow.workspace = true
bollard.workspace = true
bytes.workspace = true
futures-util.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1", "server"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
berth-config.workspace = true
berth-models.workspace = true
berth-proto.workspace = true
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
sysinfo.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tokio-stream.workspace = true
tonic = { workspace = true, features = ["tls-ring"] }
tonic-prost.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
zip.workspace = true

[lints]
workspace = true

[dev-dependencies]
rcgen.workspace = true
tokio = { workspace = true, features = ["net"] }
