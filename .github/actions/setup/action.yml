name: Setup
description: Install protoc, the Rust toolchain, Vite+, and build the berth-ui dashboard frontend

inputs:
  components:
    description: Extra rustup components to install (e.g. clippy)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install protoc
      shell: bash
      run: sudo apt update && sudo apt install -y protobuf-compiler
    - name: Install stable toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.components }}
    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
    - name: Install Vite+
      shell: bash
      run: |
        curl -fsSL https://vite.plus | bash
        echo "$HOME/.vite-plus/bin" >> "$GITHUB_PATH"
    - name: Cache berth-ui dependencies
      uses: actions/cache@v6
      with:
        path: berth-ui/node_modules
        key: berth-ui-${{ runner.os }}-${{ hashFiles('berth-ui/pnpm-lock.yaml') }}
    - name: Build dashboard frontend
      shell: bash
      run: cargo xtask build-ui
