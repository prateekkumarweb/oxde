name: Setup
description: Install the Rust toolchain, Vite+, and build the oxde-ui dashboard frontend

inputs:
  components:
    description: Extra rustup components to install (e.g. clippy)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install stable toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.components }}
    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
    - name: Install Vite+
      shell: bash
      run: |
        curl -fsSL https://vite.plus | bash
        echo "$HOME/.vite-plus/bin" >> "$GITHUB_PATH"
    - name: Cache oxde-ui dependencies
      uses: actions/cache@v6
      with:
        path: oxde-ui/node_modules
        key: oxde-ui-${{ runner.os }}-${{ hashFiles('oxde-ui/pnpm-lock.yaml') }}
    - name: Build dashboard frontend
      shell: bash
      run: cargo xtask build-ui
